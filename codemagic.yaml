workflows:
  native-android:
    name: NovaX Agent APK
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Build NovaX APK
        script: |
          cd novax-agent/android
          gradle --version
          gradle assembleDebug --stacktrace

    artifacts:
      - novax-agent/android/app/build/outputs/apk/debug/*.apk
