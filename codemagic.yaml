workflows:
  native-android:
    name: NovaX Agent APK
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build APK
        script: |
          cd android
          gradle assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
